<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Celular — Gincana</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            color: #94a3b8;
            padding: 20px;
        }
        h1 {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .phone {
            width: 390px;
            height: 844px;
            max-width: 100%;
            max-height: calc(100vh - 80px);
            border: 10px solid #1e1e1e;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), inset 0 0 0 2px #333;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Preview modo celular — iPhone 13 (390×844)</h1>
    <div class="phone">
        <iframe src="index.html" title="Placar Gincana"></iframe>
    </div>
</body>
</html>
