<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
           
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

       
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

       
        .loader {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            cursor: pointer;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .loader:hover .circle {
            box-shadow: 0 0 25px rgba(96, 165, 250, 0.8);
        }

        .circle:nth-child(1) {
            width: 100%; height: 100%;
            top: 0; left: 0;
            border-top-color: #93c5fd;
            animation: spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .circle:nth-child(2) {
            width: 76%; height: 76%;
            top: 12%; left: 12%;
            border-right-color: #60a5fa;
            animation: spin 2.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
        }

        .circle:nth-child(3) {
            width: 52%; height: 52%;
            top: 24%; left: 24%;
            border-bottom-color: #bfdbfe;
            animation: spin 3s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.1rem;
            color: #dbeafe;
            line-height: 1.5;
            font-weight: 300;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 1rem; }
            .loader { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
        <h1>Em Manutenção</h1>
        <p>Estamos em Manutenção. Voltamos muito em breve!</p>
    </div>
</body>
</html>
